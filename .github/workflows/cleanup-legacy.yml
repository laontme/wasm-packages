name: Delete legacy rg packages
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify replacement tags and delete only legacy packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api 'users/laontme/packages/container/wasm-packages%2Frg/versions' > versions.json
          jq -e 'any(.[].metadata.container.tags[]; . == "15.2.0-wasip1") and any(.[].metadata.container.tags[]; . == "15.2.0-wasip2")' versions.json
          gh api --method DELETE 'users/laontme/packages/container/wasm-packages%2Frg-p1'
          gh api --method DELETE 'users/laontme/packages/container/wasm-packages%2Frg-p2'
