name: Publish WASI package to GHCR
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        default: jq
        options: [jq, ripgrep, coreutils, python, findutils, grep, sed]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v21
      - run: nix build .#checks.x86_64-linux.${{ inputs.package }} -L
      - run: nix build .#${{ inputs.package }}-oci -o result-oci
      - name: Publish versioned image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          PACKAGE: ${{ inputs.package }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version=$(nix eval --raw ".#$PACKAGE.version")
          registry="ghcr.io/${REPOSITORY,,}/$PACKAGE"
          export ORAS_REGISTRY_CONFIG="$RUNNER_TEMP/ghcr-auth.json"
          printf '%s' "$GHCR_TOKEN" | nix develop -c oras login --registry-config "$ORAS_REGISTRY_CONFIG" --username "$GHCR_USER" --password-stdin ghcr.io
          nix develop -c oras cp --to-registry-config "$ORAS_REGISTRY_CONFIG" --from-oci-layout "result-oci:$version" "$registry:$version"
          nix develop -c oras tag --registry-config "$ORAS_REGISTRY_CONFIG" "$registry:$version" latest
